name: Update Plex Ratings

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch ratings from Plex
        run: node scripts/fetch-ratings.js
        env:
          PLEX_URL:              ${{ secrets.PLEX_URL }}
          PLEX_TOKEN:            ${{ secrets.PLEX_TOKEN }}
          OWNER_NAME:            ${{ vars.OWNER_NAME }}
          SHOWS_TAB_LABEL:       ${{ vars.SHOWS_TAB_LABEL }}
          SHOWS_SECTION_LABEL:   ${{ vars.SHOWS_SECTION_LABEL }}
          MOVIES_TAB_LABEL:      ${{ vars.MOVIES_TAB_LABEL }}
          MOVIES_SECTION_LABEL:  ${{ vars.MOVIES_SECTION_LABEL }}
          DEFAULT_THEME:         ${{ vars.DEFAULT_THEME }}

      - name: Commit and push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update ratings data'
          file_pattern: 'data.json config.json posters/'
